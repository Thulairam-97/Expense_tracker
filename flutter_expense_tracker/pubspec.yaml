name: upi_expense_tracker
description: A production-ready zero-manual-entry personal expense tracker powered by Android NotificationListenerService and UPI payment detection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Local Database (SQLite via Drift)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0

  # Material 3 & UI Polish
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # Notifications & Permissions
  flutter_local_notifications: ^17.1.0
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
