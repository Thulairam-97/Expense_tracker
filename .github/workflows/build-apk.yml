name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Setup
        run: flutter doctor -v

      - name: Reconcile Android Platform & Gradle Files
        working-directory: flutter_expense_tracker
        run: |
          # 1. Back up our custom native Kotlin listener, receiver, and AndroidManifest
          mkdir -p /tmp/native_backup
          cp -r android/app/src/main/kotlin /tmp/native_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/native_backup/

          # 2. Run flutter create to generate the official Gradle wrapper, gradlew, and build configs
          flutter create --platforms=android --org com.personal.upiexpensetracker .

          # 3. Restore our custom native Kotlin listener, receiver, and AndroidManifest
          cp -r /tmp/native_backup/kotlin/* android/app/src/main/kotlin/
          cp /tmp/native_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew || true

      - name: Install Flutter Dependencies
        working-directory: flutter_expense_tracker
        run: flutter pub get

      - name: Build Debug APK
        working-directory: flutter_expense_tracker
        run: flutter build apk --debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upi-expense-tracker-debug-apk
          path: flutter_expense_tracker/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
