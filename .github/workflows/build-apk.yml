name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Setup
        run: flutter doctor -v

      - name: Scaffold Clean Android Platform & Integrate Native Services
        working-directory: flutter_expense_tracker
        run: |
          set -e
          echo "==> Backing up custom native Kotlin code and manifest..."
          mkdir -p /tmp/native_backup
          cp -r android/app/src/main/kotlin/com/personal/upiexpensetracker /tmp/native_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/native_backup/

          echo "==> Generating clean official Android scaffold..."
          rm -rf android
          flutter create --platforms android --org com.personal .

          echo "==> Removing default scaffold activity..."
          rm -rf android/app/src/main/kotlin/*
          rm -rf android/app/src/main/java/*

          echo "==> Installing our custom native services, receivers, and activity..."
          mkdir -p android/app/src/main/kotlin/com/personal/upiexpensetracker
          cp -r /tmp/native_backup/upiexpensetracker/* android/app/src/main/kotlin/com/personal/upiexpensetracker/
          
          echo "==> Integrating custom permissions and services into generated AndroidManifest..."
          # Insert permissions before <application
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <queries>\n        <package android:name="com.google.android.apps.nbu.paisa.user" />\n        <package android:name="com.phonepe.app" />\n        <package android:name="net.one97.paytm" />\n        <package android:name="in.org.npci.upiapp" />\n        <package android:name="com.dreamplug.androidapp" />\n    </queries>' android/app/src/main/AndroidManifest.xml
          
          # Insert custom services and receivers right before </application>
          sed -i '/<\/application>/i \        <service\n            android:name=".service.PaymentNotificationListenerService"\n            android:label="UPI Expense Notification Interceptor"\n            android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.service.notification.NotificationListenerService" />\n            </intent-filter>\n        </service>\n        <receiver\n            android:name=".service.NotificationActionReceiver"\n            android:exported="false">\n            <intent-filter>\n                <action android:name="com.personal.upiexpensetracker.ACTION_RECORD_CATEGORY" />\n                <action android:name="com.personal.upiexpensetracker.ACTION_DISMISS_NOTIFICATION" />\n            </intent-filter>\n        </receiver>' android/app/src/main/AndroidManifest.xml

          echo "==> Aligning namespace and applicationId in build.gradle..."
          sed -i 's/namespace = "com.personal.upi_expense_tracker"/namespace = "com.personal.upiexpensetracker"/g' android/app/build.gradle || true
          sed -i 's/namespace "com.personal.upi_expense_tracker"/namespace "com.personal.upiexpensetracker"/g' android/app/build.gradle || true
          sed -i 's/applicationId = "com.personal.upi_expense_tracker"/applicationId = "com.personal.upiexpensetracker"/g' android/app/build.gradle || true
          sed -i 's/applicationId "com.personal.upi_expense_tracker"/applicationId "com.personal.upiexpensetracker"/g' android/app/build.gradle || true

          echo "==> Configuring minSdkVersion = 26 in app/build.gradle..."
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 26/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' android/app/build.gradle || true

          echo "==> Setting Android SDK path in local.properties..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew

      - name: Install Dependencies
        working-directory: flutter_expense_tracker
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: flutter_expense_tracker
        run: flutter test
        continue-on-error: true

      - name: Analyze Dart Code
        working-directory: flutter_expense_tracker
        run: flutter analyze
        continue-on-error: true

      - name: Build Debug APK
        working-directory: flutter_expense_tracker
        run: flutter build apk --debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upi-expense-tracker-debug-apk
          path: flutter_expense_tracker/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
