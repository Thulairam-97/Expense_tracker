name: Build Flutter APK for Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Platform & Integrate Native Services
        working-directory: flutter_expense_tracker
        run: |
          set -e
          echo "==> Backing up custom native Kotlin code, resources, and manifest..."
          mkdir -p /tmp/native_backup
          cp -r android/app/src/main/kotlin /tmp/native_backup/
          cp -r android/app/src/main/res /tmp/native_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/native_backup/

          echo "==> Generating clean official Android scaffold..."
          rm -rf android
          flutter create --platforms android --org com.personal .

          echo "==> Restoring custom Kotlin native services, receivers, and activities..."
          rm -rf android/app/src/main/kotlin/*
          cp -r /tmp/native_backup/kotlin/* android/app/src/main/kotlin/

          echo "==> Restoring custom AndroidManifest.xml and styles..."
          cp -f /tmp/native_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -rf /tmp/native_backup/res/* android/app/src/main/res/

          echo "==> Ensuring namespace and applicationId are com.personal.upiexpensetracker..."
          find android/app -name "build.gradle*" -type f -exec sed -i 's/com\.personal\.upi_expense_tracker/com.personal.upiexpensetracker/g' {} +
          find android/app -name "build.gradle*" -type f -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' {} +
          find android/app -name "build.gradle*" -type f -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 26/g' {} +
          find android/app -name "build.gradle*" -type f -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' {} +

          echo "==> Ensuring required AndroidX dependencies are present..."
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/dependencies {/a \    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/dependencies {/a \    implementation("androidx.core:core-ktx:1.12.0")\n    implementation("androidx.appcompat:appcompat:1.6.1")' android/app/build.gradle.kts || true
          fi

          echo "==> Setting Android SDK path in local.properties..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          chmod +x android/gradlew

      - name: Install Dependencies
        working-directory: flutter_expense_tracker
        run: flutter pub get

      - name: Build Debug APK
        working-directory: flutter_expense_tracker
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upi-expense-tracker-debug-apk
          path: flutter_expense_tracker/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
