name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Setup
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: flutter_expense_tracker
        run: flutter pub get

      - name: Build Debug APK
        working-directory: flutter_expense_tracker
        run: flutter build apk --debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upi-expense-tracker-debug-apk
          path: flutter_expense_tracker/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
