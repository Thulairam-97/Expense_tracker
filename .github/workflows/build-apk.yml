name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Setup
        run: flutter doctor -v

      - name: Prepare Clean Android Platform
        run: |
          # 1. Back up our custom native Android files
          mkdir -p /tmp/custom_code
          cp -r flutter_expense_tracker/android/app/src/main/kotlin /tmp/custom_code/
          cp flutter_expense_tracker/android/app/src/main/AndroidManifest.xml /tmp/custom_code/

          # 2. Generate a fresh, compatible Android scaffold using the exact Flutter SDK on the runner
          flutter create --org com.personal.upiexpensetracker --project-name upi_expense_tracker /tmp/fresh_app

          # 3. Replace android directory with the official scaffold
          rm -rf flutter_expense_tracker/android
          cp -r /tmp/fresh_app/android flutter_expense_tracker/

          # 4. Restore our custom native Kotlin services and AndroidManifest
          cp -r /tmp/custom_code/kotlin/* flutter_expense_tracker/android/app/src/main/kotlin/
          cp -f /tmp/custom_code/AndroidManifest.xml flutter_expense_tracker/android/app/src/main/AndroidManifest.xml
          chmod +x flutter_expense_tracker/android/gradlew

          # 5. Set minSdkVersion to 26 for NotificationListenerService compatibility
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 26/g' flutter_expense_tracker/android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' flutter_expense_tracker/android/app/build.gradle || true

          # 6. Ensure local.properties references the runner's Android SDK
          echo "sdk.dir=$ANDROID_SDK_ROOT" > flutter_expense_tracker/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> flutter_expense_tracker/android/local.properties

      - name: Install Dependencies
        working-directory: flutter_expense_tracker
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: flutter_expense_tracker
        run: flutter test

      - name: Build Debug APK
        working-directory: flutter_expense_tracker
        run: flutter build apk --debug --verbose

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upi-expense-tracker-debug-apk
          path: flutter_expense_tracker/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
